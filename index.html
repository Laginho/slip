<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <!-- Keep in sync with MANIFEST_THEME in src/palette.ts. -->
    <meta name="theme-color" content="#f5f4f2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tasks</title>
    <style>
      /* Reset and layout only. Every colour lives in src/palette.ts. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        /* Capture must never be scrolled away from; the list scrolls, the page does not. */
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      input {
        font: inherit;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
